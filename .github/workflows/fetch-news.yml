name: Fetch News Feeds

on:
  schedule:
    # GitHub delays and drops scheduled jobs at the top of the hour (everyone's jobs start then).
    # Running at :17 avoids that rush. GitHub still doesn't guarantee exact timing.
    - cron: '17 * * * *'  # every hour, at 17 minutes past
  workflow_dispatch: {}    # manual runs, and the backend's watchdog when the schedule slips (scheduler/watchdog.mjs)

# Never run two copies at once (a late scheduled run and a watchdog run could overlap).
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch all feeds
        run: node scripts/fetch-feeds.mjs

      # English translations of non-English reports (lib/translate.mjs). Needs the
      # TRANSLATE_API_KEY repository secret (DeepL by default; set the TRANSLATE_PROVIDER
      # repository variable to "microsoft" for Microsoft Translator). Without a key it only
      # re-attaches saved translations. Never blocks the news update.
      - name: Translate new reports to English
        continue-on-error: true
        timeout-minutes: 5
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}
          TRANSLATE_REGION: ${{ vars.TRANSLATE_REGION }}
        run: node scripts/translate-reports.mjs

      # Context layers: UCDP conflict events (checked daily) and US travel advisories that
      # name terrorism (lib/context.mjs). Never blocks the news update.
      - name: Collect conflict events and advisories
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/collect-context.mjs

      # Trackers: places reported terrorism, cyber and military incidents from the reports above,
      # and summarizes wars from the UCDP events (lib/incidents.mjs). Never blocks the news update.
      - name: Build tracker markers
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/collect-incidents.mjs

      # Ships: listen to AISStream for ~5 minutes and save data/ships.json.
      # Needs the AISSTREAM_API_KEY repository secret. If it fails or hears nothing,
      # the previous snapshot is kept and the news update still goes out.
      - name: Collect ship snapshot
        continue-on-error: true
        timeout-minutes: 9
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          # Ships send their name and type every ~6 minutes, so listening longer labels more of them.
          SHIPS_COLLECT_SECONDS: "300"
        run: node scripts/collect-ships.mjs

      - name: Commit and push cache if it changed
        run: |
          git config user.name "wire-room-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/cache.json
          if [ -f data/ships.json ]; then git add data/ships.json; fi
          if [ -f data/translations.json ]; then git add data/translations.json; fi
          for f in data/conflict.json data/advisories.json data/context-state.json data/incidents.json data/war-intel.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --staged --quiet || git commit -m "chore: update cached news feeds"
          git push
