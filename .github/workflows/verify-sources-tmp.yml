name: verify-sources-tmp
on:
  push:
    branches: [verify-sources-tmp]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          rm -f data/conflict.json data/advisories.json data/context-state.json
          node scripts/collect-context.mjs
          ls -la data/
      - run: node scripts/tmp-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: context-data
          path: |
            data/conflict.json
            data/advisories.json
