name: verify-sources-tmp
on:
  push:
    branches: [verify-sources-tmp]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          rm -f data/conflict.json data/advisories.json data/context-state.json
          node scripts/collect-context.mjs
          ls -la data/
      - run: node scripts/tmp-report.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          mkdir -p tmpdata && cp data/conflict.json data/advisories.json tmpdata/
          git add tmpdata && git commit -m "tmp: collected context data" && git push
