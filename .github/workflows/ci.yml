# Checks every code change: lint (code quality rules), automated tests, and a production build.
# The hourly data job's commits (data/ only) are skipped; they don't change code.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
