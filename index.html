<!doctype html>

    <script>
      // Pick the theme before the page paints: the saved choice, else the device setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem("wireroom-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Wire Room | Official statements and independent news, on a map</title>
    <meta name="description" content="Wire Room puts what governments say next to what independent outlets report, country by country, on an interactive world map. Draw, annotate, and pin reports." />

    <meta property="og:description" content="Official government statements next to independent news, country by country, on one map. Annotate, pin reports, track ships and military aircraft." />

    <meta property="og:site_name" content="Wire Room" />

    <meta property="og:image:alt" content="Wire Room: a dark map of Europe and the Middle East with country markers and military, terrorism and cyber event markers, next to the tagline: What governments say, next to what the news reports, on one live map. Labels: Official, News, Analyst." />
